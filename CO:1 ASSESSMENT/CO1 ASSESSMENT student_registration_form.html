<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F3E8;
    --ink: #1F2A44;
    --ink-soft: #4B5568;
    --amber: #E8A33D;
    --rule: #C9C2AE;
    --card: #FFFDF8;
    --error: #B4523C;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    padding: 48px 20px;
    background: var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 28px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
  }

  h1{
    display:none; /* replaced visually by ticket header */
  }

  .ticket{
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    box-shadow: 6px 6px 0 var(--ink);
    position: relative;
    overflow: visible;
  }

  .ticket-header{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 22px 28px 18px;
    border-bottom: 2px dashed var(--rule);
  }

  .ticket-header .title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 26px;
    letter-spacing: -0.02em;
  }

  .ticket-header .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .stamp{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-align:right;
    color: var(--amber);
    border: 1.5px solid var(--amber);
    padding: 6px 10px;
    border-radius: 3px;
    transform: rotate(3deg);
    white-space: nowrap;
  }

  form{
    padding: 26px 28px 30px;
    display:grid;
    gap: 18px;
  }

  .field{
    display:grid;
    gap: 6px;
  }

  label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }

  input[type="text"],
  input[type="email"],
  input[type="date"],
  select,
  textarea{
    font-family:'Inter', sans-serif;
    font-size: 15px;
    padding: 10px 12px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    background: var(--card);
    color: var(--ink);
    width: 100%;
  }

  input:focus, select:focus, textarea:focus{
    outline: none;
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(232,163,61,0.25);
  }

  textarea{ resize: vertical; }

  .row-inline{
    display:flex;
    gap: 24px;
    align-items:center;
    flex-wrap: wrap;
  }

  .radio-option{
    display:flex;
    align-items:center;
    gap: 6px;
  }

  .radio-option label{
    text-transform:none;
    font-size: 14px;
    letter-spacing: normal;
    color: var(--ink);
    font-family:'Inter', sans-serif;
  }

  input[type="radio"], input[type="checkbox"]{
    accent-color: var(--amber);
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .file-drop{
    border: 1.5px dashed var(--rule);
    border-radius: 3px;
    padding: 12px;
    background: var(--paper);
  }

  .declaration{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    padding-top: 6px;
    border-top: 2px dashed var(--rule);
  }

  .declaration label{
    text-transform:none;
    font-size: 13px;
    letter-spacing: normal;
    color: var(--ink-soft);
    font-family:'Inter', sans-serif;
  }

  .actions{
    display:flex;
    gap: 12px;
    margin-top: 4px;
  }

  button{
    font-family:'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 3px;
    border: 1.5px solid var(--ink);
    cursor: pointer;
    transition: transform 0.08s ease;
  }

  button:active{ transform: translateY(2px); }

  button[type="submit"]{
    background: var(--ink);
    color: var(--paper);
  }

  button[type="submit"]:hover{ background: #2E3C5E; }

  button[type="reset"]{
    background: transparent;
    color: var(--ink);
  }

  button[type="reset"]:hover{ background: rgba(31,42,68,0.06); }

  .perforation{
    position: absolute;
    left: -8px; right: -8px;
    height: 0;
    top: 0;
  }

  @media (max-width: 480px){
    .ticket-header{ flex-direction: column; gap: 12px; }
    .stamp{ text-align:left; }
  }
</style>
</head>
<body>

<h1>Student Registration Form</h1>

<div class="ticket">
  <div class="ticket-header">
    <div>
      <div class="title">Admission Ticket</div>
      <div class="sub">Student Registration &mdash; Academic Year 2026&ndash;27</div>
    </div>
    <div class="stamp" id="courseStamp">COURSE: &mdash;</div>
  </div>

  <form action="#" method="post" id="regForm">
    <div class="field">
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>

    <div class="field">
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob">
    </div>

    <div class="field">
      <label>Gender</label>
      <div class="row-inline">
        <div class="radio-option">
          <input type="radio" id="male" name="gender" value="Male">
          <label for="male">Male</label>
        </div>
        <div class="radio-option">
          <input type="radio" id="female" name="gender" value="Female">
          <label for="female">Female</label>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="course">Select Course</label>
      <select id="course" name="course">
        <option value="">--Select Course--</option>
        <option value="CSE">Computer Science Engineering</option>
        <option value="ECE">Electronics and Communication Engineering</option>
        <option value="EEE">Electrical and Electronics Engineering</option>
        <option value="MECH">Mechanical Engineering</option>
      </select>
    </div>

    <div class="field">
      <label for="address">Address</label>
      <textarea id="address" name="address" rows="4" placeholder="Enter your address"></textarea>
    </div>

    <div class="field">
      <label for="photo">Upload Photograph</label>
      <div class="file-drop">
        <input type="file" id="photo" name="photo">
      </div>
    </div>

    <div class="declaration">
      <input type="checkbox" id="declaration" name="declaration" required>
      <label for="declaration">I confirm that the above information is correct.</label>
    </div>

    <div class="actions">
      <button type="submit">Register</button>
      <button type="reset">Clear</button>
    </div>
  </form>
</div>

<script>
  const courseSelect = document.getElementById('course');
  const stamp = document.getElementById('courseStamp');
  courseSelect.addEventListener('change', () => {
    stamp.textContent = courseSelect.value ? 'COURSE: ' + courseSelect.value : 'COURSE: —';
  });

  document.getElementById('regForm').addEventListener('reset', () => {
    setTimeout(() => { stamp.textContent = 'COURSE: —'; }, 0);
  });
</script>

</body>
</html>
