<!DOCTYPE html>
<html>
<head>
    <title>Web Technology Assignment Portal</title>
    <style>
        /* 1. Reset and Body Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9; /* Soft slate gray background */
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 2. Banner/Header Styling (demonstrates the <img> tag) */
        header {
            position: relative;
            background-color: #0f172a;
            color: #ffffff;
            overflow: hidden;
            height: 160px;
        }

        /* Banner background image */
        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Crops and fits the image nicely */
            opacity: 0.3;      /* Fades image to let text show clearly */
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .header-content {
            position: relative;
            z-index: 2; /* Keeps text on top of the background banner image */
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .header-content h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #f8fafc;
        }

        .header-content p {
            font-size: 1rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        /* 3. Main Workspace Layout (Sidebar on the left, Iframe on the right) */
        .main-workspace {
            display: flex;
            flex: 1; /* Automatically expands to fill vertical space */
        }

        /* Sidebar container */
        .sidebar {
            width: 280px;
            background-color: #0f172a; /* Dark navy color */
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar h3 {
            color: #64748b;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        /* Sidebar Hyperlinks (demonstrates the <a> tag) */
        .sidebar a {
            display: block;
            color: #94a3b8;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        /* Hover indicator on links */
        .sidebar a:hover {
            background-color: #1e293b;
            color: #3b82f6; /* Bright blue highlighted text */
            transform: translateX(5px); /* Slide right animation */
        }

        /* Active highlight for when frame content is loaded */
        .sidebar a:focus {
            background-color: #1d4ed8;
            color: #ffffff;
        }

        /* 4. Iframe Container area (demonstrates the <iframe> tag) */
        .iframe-container {
            flex-grow: 1; /* Fills up all remaining screen width */
            padding: 25px;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
        }

        /* Title tag for the interactive frame workspace */
        .workspace-label {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Actual iframe styles */
        .content-frame {
            width: 100%;
            height: 100%;
            min-height: 550px;
            border: 2px dashed #cbd5e1; /* Visual dashed border */
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        /* Responsive design for tablets and mobile devices */
        @media (max-width: 768px) {
            .main-workspace {
                flex-direction: column; /* Stacks sidebar above the iframe */
            }
            .sidebar {
                width: 100%;
                padding: 15px;
            }
            .sidebar a {
                display: inline-block;
                margin: 5px;
            }
        }
    </style>
</head>
<body>

    <!-- Header containing banner image and main titles -->
    <header>
        <!-- Demonstration of the <img> tag -->
        <img class="banner-img" src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?auto=format&fit=crop&w=1200&q=80" alt="Tech workspace background banner" />
        <div class="header-content">
            <h1>Web Technology Workspace</h1>
            <p>Welcome to Gokul's assignment dashboard</p>
        </div>
    </header>

    <!-- Main Content Workspace section -->
    <div class="main-workspace">
        
        <!-- Sidebar containing Navigation Hyperlinks -->
        <div class="sidebar">
            <h3>Assignments</h3>
            
            <!-- Target parameter tells the browser to open the link inside the named iframe -->
            <a href="welcome_iframe.html" target="content-frame">🏠 Dashboard Home</a>
            <a href="creating a class timetable using html table.html" target="content-frame">📅 Class Timetable</a>
            <a href="creatiing an xhtml compliant web page.html" target="content-frame">✅ XHTML Compliance</a>
            <a href="creating an xml document for student data.html" target="content-frame">📂 XML Student Data</a>
        </div>

        <!-- Iframe viewport box where clicked links load -->
        <div class="iframe-container">
            <div class="workspace-label">Interactive Workspace Frame</div>
            
            <!-- Demonstration of the <iframe> tag with initial 'src' loading the welcome screen -->
            <iframe class="content-frame" name="content-frame" src="welcome_iframe.html" title="Assignment Workspace Frame"></iframe>
        </div>
        
    </div>

</body>
</html>
