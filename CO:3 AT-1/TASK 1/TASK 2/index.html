<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Student Result Processing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <header class="page-header">
            <p class="eyebrow">Servlet-based practical</p>
            <h1>Student Result Processing</h1>
            <p>Submit three subject marks and receive a complete result summary.</p>
        </header>

        <form class="result-form" action="student-result" method="post">
            <div class="field-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>

            <div class="field-group">
                <label for="registerNumber">Register Number</label>
                <input type="text" id="registerNumber" name="registerNumber" required>
            </div>

            <fieldset>
                <legend>Subject marks</legend>
                <div class="marks-grid">
                    <div class="field-group">
                        <label for="subject1">Subject 1</label>
                        <input type="number" id="subject1" name="subject1" min="0" max="100" step="1" required>
                    </div>

                    <div class="field-group">
                        <label for="subject2">Subject 2</label>
                        <input type="number" id="subject2" name="subject2" min="0" max="100" step="1" required>
                    </div>

                    <div class="field-group">
                        <label for="subject3">Subject 3</label>
                        <input type="number" id="subject3" name="subject3" min="0" max="100" step="1" required>
                    </div>
                </div>
            </fieldset>

            <button type="submit">Calculate Result</button>
        </form>
    </main>
</body>
</html>
